name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Krav: Hash-pinning for supply-chain sikkerhed (v4.2.2)
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Krav: Sikrer hash-pinning ved opsætning af Java 25
      - name: Set up JDK 25
        uses: actions/actions-setup-java@3a42ae2a8742cb52dfc5e0da8e2be359850c95a3
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Krav: Skal udføre maven tests
      - name: Run Maven Tests
        run: ./mvnw test -B

      # Logger ind på GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Udregner jeres metadata og tags (både commit-SHA og latest)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      # Krav: Skal bygge Docker image fra Dockerfile og pushe til GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}