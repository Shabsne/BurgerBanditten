<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BurgerBanditten – Opret konto</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/burger.css">
</head>
<body class="bg-glow page-center">

<div class="card register-card fade-up">

  <div class="logo">Burger<span>Banditten</span></div>
  <div class="subtitle">Opret din konto</div>

  <div class="success-banner" id="successBanner">
    ✓ Konto oprettet! Du bliver omdirigeret til menuen.
  </div>

  <form id="registerForm" novalidate>

    <div class="form-group">
      <label for="name">Fuldt navn</label>
      <input type="text" id="name" placeholder="Eks. Anders Jensen" autocomplete="name">
      <div class="error-msg" id="nameError"></div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Eks. anders@email.dk" autocomplete="email">
      <div class="error-msg" id="emailError"></div>
    </div>

    <div class="form-group">
      <label for="password">Adgangskode</label>
      <input type="password" id="password" placeholder="Minimum 8 tegn" autocomplete="new-password">
      <div class="strength-bar" id="strengthBar">
        <span></span><span></span><span></span>
      </div>
      <div class="strength-label" id="strengthLabel"></div>
      <div class="error-msg" id="passwordError"></div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Bekræft adgangskode</label>
      <input type="password" id="confirmPassword" placeholder="Gentag adgangskode" autocomplete="new-password">
      <div class="error-msg" id="confirmError"></div>
    </div>

    <button type="submit" class="btn-primary" id="submitBtn">
      <div class="spinner"></div>
      <span class="btn-text">Opret konto</span>
    </button>

  </form>

  <div class="divider">eller</div>

  <div class="auth-footer">
    Har du allerede en konto? <a href="/login.html">Log ind her</a>
  </div>

</div>

<script src="/js/register.js"></script>
</body>
</html>
