<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BurgerBanditten – Opret Konto</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .page-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card { max-width: 480px; width: 100%; }

    .login-link {
      text-align: center;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .strength-bar {
      display: flex;
      gap: 4px;
      margin-top: 0.5rem;
    }

    .strength-bar span {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: var(--border);
      transition: background 0.3s;
    }

    .strength-bar.weak   span:nth-child(1)    { background: var(--error); }
    .strength-bar.medium span:nth-child(-n+2) { background: var(--warning); }
    .strength-bar.strong span                 { background: var(--success); }

    .strength-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }
  </style>
</head>
<body class="bg-glow">

<div class="page-content">
  <div class="card fade-up">
    <div class="logo">Burger<span>Banditten</span></div>
    <div class="subtitle">Opret din konto</div>

    <div class="success-banner" id="successBanner" style="display:none">
      ✓ Konto oprettet! Tjek din email for bekræftelse.
    </div>

    <form id="registerForm" novalidate>

      <div class="form-group">
        <label for="name">Fuldt navn</label>
        <input type="text" id="name" placeholder="Eks. Anders Jensen" autocomplete="name"/>
        <div class="error-msg" id="nameError"></div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Eks. anders@email.dk" autocomplete="email"/>
        <div class="error-msg" id="emailError"></div>
      </div>

      <div class="form-group">
        <label for="password">Adgangskode</label>
        <input type="password" id="password" placeholder="Minimum 8 tegn" autocomplete="new-password"/>
        <div class="strength-bar" id="strengthBar">
          <span></span><span></span><span></span>
        </div>
        <div class="strength-label" id="strengthLabel"></div>
        <div class="error-msg" id="passwordError"></div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Bekræft adgangskode</label>
        <input type="password" id="confirmPassword" placeholder="Gentag adgangskode" autocomplete="new-password"/>
        <div class="error-msg" id="confirmError"></div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        <div class="spinner"></div>
        <span class="btn-text">Opret konto</span>
      </button>

    </form>

    <div class="divider">eller</div>

    <div class="login-link">
      Har du allerede en konto? <a href="/login.html">Log ind her</a>
    </div>
  </div>
</div>

<script src="/js/register.js"></script>

</body>
</html>
