<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BurgerBanditten – Opret Konto</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <!-- Link til ekstern CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <div class="logo">Burger<span>Banditten</span></div>
  <div class="subtitle">Opret din konto</div>

  <div class="success-banner" id="successBanner">
    ✓ Konto oprettet! Tjek din email for bekræftelse.
  </div>

  <form id="registerForm" novalidate>
    <div class="form-group">
      <label for="name">Fuldt navn</label>
      <input type="text" id="name" placeholder="Eks. Anders Jensen" autocomplete="name">
      <div class="error-msg" id="nameError">Navn skal udfyldes</div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Eks. anders@email.dk" autocomplete="email">
      <div class="error-msg" id="emailError">Indtast en gyldig email</div>
    </div>

    <div class="form-group">
      <label for="password">Adgangskode</label>
      <input type="password" id="password" placeholder="Minimum 8 tegn" autocomplete="new-password">
      <div class="strength-bar" id="strengthBar">
        <span></span><span></span><span></span>
      </div>
      <div class="strength-label" id="strengthLabel"></div>
      <div class="error-msg" id="passwordError">Adgangskode skal være mindst 8 tegn</div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Bekræft adgangskode</label>
      <input type="password" id="confirmPassword" placeholder="Gentag adgangskode" autocomplete="new-password">
      <div class="error-msg" id="confirmError">Adgangskoderne stemmer ikke overens</div>
    </div>

    <button type="submit" class="btn-primary" id="submitBtn">
      <div class="spinner"></div>
      <span class="btn-text">Opret konto</span>
    </button>
  </form>

  <div class="divider">eller</div>

  <div class="login-link">
    Har du allerede en konto? <a href="/login">Log ind her</a>
  </div>
</div>

<script>
  // Script logik bibeholdes her da det er sidespecifikt
  const form = document.getElementById('registerForm');
  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirmPassword');
  const submitBtn = document.getElementById('submitBtn');
  const successBanner = document.getElementById('successBanner');

  passwordInput.addEventListener('input', () => {
    const val = passwordInput.value;
    const bar = document.getElementById('strengthBar');
    const label = document.getElementById('strengthLabel');
    if (val.length === 0) { bar.className = 'strength-bar'; label.textContent = ''; return; }
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    if (score === 1) { bar.className = 'strength-bar weak'; label.textContent = 'Svag'; }
    if (score === 2) { bar.className = 'strength-bar medium'; label.textContent = 'Medium'; }
    if (score === 3) { bar.className = 'strength-bar strong'; label.textContent = 'Stærk'; }
  });

  function setError(input, msgEl, message) {
    input.classList.add('error');
    msgEl.textContent = message;
    msgEl.classList.add('visible');
  }

  function setSuccess(input, msgEl) {
    input.classList.remove('error');
    input.classList.add('success');
    msgEl.classList.remove('visible');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.classList.add('loading');
    // Simulerer netværkskald
    setTimeout(() => {
      submitBtn.classList.remove('loading');
      successBanner.style.display = 'block';
      form.reset();
    }, 1500);
  });
</script>

</body>
</html>
