<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BurgerBanditten – Log ind</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/burger.css">
</head>
<body class="bg-glow page-center">

<div class="card auth-card fade-up">

  <div class="logo">Burger<span>Banditten</span></div>
  <div class="subtitle">Log ind på din konto</div>

  <form id="loginForm" novalidate>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Eks. anders@email.dk" autocomplete="email">
      <div class="error-msg" id="emailError"></div>
    </div>

    <div class="form-group">
      <div class="label-row">
        <label for="password">Adgangskode</label>
        <span class="label-link" onclick="openForgotModal()">Glemt adgangskode?</span>
      </div>
      <input type="password" id="password" placeholder="Din adgangskode" autocomplete="current-password">
      <div class="error-msg" id="passwordError"></div>
    </div>

    <button type="submit" class="btn-primary" id="submitBtn">
      <div class="spinner"></div>
      <span class="btn-text">Log ind</span>
    </button>

  </form>

  <div class="divider">eller</div>

  <button class="btn-secondary" onclick="window.location.href='/menu.html'">
    Fortsæt som gæst
  </button>

  <div class="auth-footer">
    Har du ikke en konto? <a href="/register.html">Opret konto her</a>
  </div>

</div>

<!-- Glemt adgangskode modal -->
<div class="modal-overlay" id="forgotModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">Glemt adgangskode?</div>
      <button class="modal-close" onclick="closeForgotModal()">&times;</button>
    </div>
    <p>Indtast din email – vi sender dig et link til at nulstille din adgangskode.</p>
    <div class="form-group">
      <label for="forgotEmail">Email</label>
      <input type="email" id="forgotEmail" placeholder="Din email">
      <div class="error-msg" id="forgotEmailError"></div>
    </div>
    <button class="btn-primary" onclick="sendResetLink()">
      <span class="btn-text">Send nulstillingslink</span>
    </button>
    <div class="success-msg" id="forgotSuccess">✓ Tjek din email for et nulstillingslink!</div>
  </div>
</div>

<script src="/js/login.js"></script>
</body>
</html>
