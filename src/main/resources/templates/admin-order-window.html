<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Bestillingsvindue</title>
</head>
<body>

<h1>Bestillingsvindue</h1>

<table>
    <tr>
        <th>Dag</th>
        <th>Åbner</th>
        <th>Lukker</th>
        <th>Aktiv</th>
        <th>Gem</th>
    </tr>

    <tr th:each="window : ${weeklySchedule}">
        <form method="post" action="/admin/order-window">
            <td th:text="${window.dayOfWeek}"></td>

            <td>
                <input type="time" name="openTime" th:value="${window.openTime}">
            </td>

            <td>
                <input type="time" name="closeTime" th:value="${window.closeTime}">
            </td>

            <td>
                <input type="checkbox" name="active" th:checked="${window.active}">
            </td>

            <td>
                <input type="hidden" name="dayOfWeek" th:value="${window.dayOfWeek}">
                <button type="submit">Gem</button>
            </td>
        </form>
    </tr>
</table>

</body>
</html>
